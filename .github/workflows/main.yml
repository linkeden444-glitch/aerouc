name: Build Universal Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Aero Tunnel APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Any Uploaded ZIP
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting archive: $f"
              unzip -o "$f" || true
            fi
          done
          echo "=== REPOSITORY STRUCTURE AFTER CHECKOUT / UNZIP ==="
          ls -la

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android Project & Grant Gradlew Permissions
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./Android_App/gradlew" ]; then
            chmod +x ./Android_App/gradlew
          elif [ -f "./AERO_ANDROID_PROJECT_V2/gradlew" ]; then
            chmod +x ./AERO_ANDROID_PROJECT_V2/gradlew
          else
            GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              chmod +x "$GRADLEW_PATH"
            fi
          fi

      - name: Build Android Debug APK via Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          elif [ -f "./Android_App/gradlew" ]; then
            cd Android_App
            ./gradlew assembleDebug --stacktrace --no-daemon
          elif [ -f "./AERO_ANDROID_PROJECT_V2/gradlew" ]; then
            cd AERO_ANDROID_PROJECT_V2
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            GRADLEW_DIR=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
            if [ -n "$GRADLEW_DIR" ]; then
              cd "$GRADLEW_DIR"
              ./gradlew assembleDebug --stacktrace --no-daemon
            else
              echo "Error: gradlew wrapper not found!"
              exit 1
            fi
          fi

      - name: Collect and Package APK
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -not -path "*/output_apk/*" -exec cp {} "output_apk/AeroTunnel_v2.apk" \;
          echo "=== COMPILED APK DETAILS ==="
          ls -lh output_apk/

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroTunnel-v2-Universal-APK
          path: output_apk/AeroTunnel_v2.apk
          retention-days: 30
