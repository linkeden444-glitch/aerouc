name: Build Aero Tunnel APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Android Project & Fix Permissions
        id: locate_project
        run: |
          echo "=== Repository Root Listing ==="
          ls -la

          # Check if gradlew is in root or any subfolder
          if [ -f "gradlew" ]; then
            PROJECT_DIR="."
          else
            FOUND_GRADLEW=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND_GRADLEW" ]; then
              PROJECT_DIR=$(dirname "$FOUND_GRADLEW")
            else
              echo "::error::No gradlew or Android files found in this repository! Please upload the project files from the ZIP."
              exit 1
            fi
          fi

          echo "Project directory located at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          # Fix line endings and permissions
          sed -i 's/\r$//' "$PROJECT_DIR/gradlew" || true
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK with Gradle
        run: |
          cd "${{ steps.locate_project.outputs.project_dir }}"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroTunnel-Release-APK
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 30
