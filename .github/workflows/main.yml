name: Build Aero Tunnel APK

"on":
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Workspace & Extract Archive
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Extracting project ZIP archive..."
            unzip -o *.zip || true
          fi
          if [ ! -f gradlew ]; then
            SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Found project inside $SUBDIR, moving to root..."
              cp -r $SUBDIR/* . 2>/dev/null || true
            fi
          fi
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Build Release APK with Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroTunnel-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
